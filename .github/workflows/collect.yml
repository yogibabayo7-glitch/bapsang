# 매일 KAMIS 시세를 받아서 docs/data 에 저장해요 (GitHub Pages로 공개)
name: 시세 수집
on:
  schedule:
    # 한국시간 평일 10:05, 14:05, 19:05 / 토요일 10:05 (UTC로 적어요)
    - cron: '5 1,5,10 * * 1-5'
    - cron: '5 1 * * 6'
  workflow_dispatch:
    inputs:
      day:
        description: '조사일 YYYY-MM-DD (비우면 자동)'
        required: false
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 시세 받기
        run: node scripts/collect.ts ${{ github.event.inputs.day }}
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
      - name: 저장
        run: |
          git config user.name "jangbaguni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data/snapshots
          git diff --cached --quiet || git commit -m "시세 $(date -u +%F)"
          git pull --rebase
          git push
